<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pictures">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css">
  <title>Picture Search</title>
</head>
<body>
  <header>
    <form id="search-form" action="javascript:void(0)">
      <input type="search" id="search-input" placeholder="What do you want to see?" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button type="button" id="voice-btn" aria-label="Voice search">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="1" width="6" height="12" rx="3"/>
          <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <button type="submit" id="search-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </form>
  </header>

  <main>
    <div id="grid" class="grid"></div>
    <button type="button" id="more-btn" class="more-btn hidden">More pictures</button>
    <div id="empty" class="empty hidden">No pictures found. Try something else!</div>
    <div id="spinner" class="spinner hidden">
      <div class="spinner-dot"></div>
    </div>
  </main>

  <div id="fullscreen" class="fullscreen hidden">
    <div class="fs-controls">
      <button id="fav-btn" class="fs-ctrl-btn" aria-label="Favorite">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>
      <button id="hide-btn" class="fs-ctrl-btn" aria-label="Hide image">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
      </button>
    </div>
    <button id="close-btn" class="close-btn" aria-label="Close">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <div id="fs-image-container" class="fs-image-container">
      <img id="fs-image-prev" class="fs-image fs-image-side fs-image-prev" src="" alt="">
      <img id="fs-image" class="fs-image" src="" alt="">
      <img id="fs-image-next" class="fs-image fs-image-side fs-image-next" src="" alt="">
    </div>
    <div id="fs-tags" class="fs-tags hidden"></div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/fullscreen.js"></script>
</body>
</html>
